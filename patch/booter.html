<!DOCTYPE html><html lang="en"><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>patch</title></head>
<body marginheight=0><iframe id=app title=patch width=100% height=640 frameborder=0></iframe>
<script>
(function(){
var f=document.getElementById("app"),P="p1:";
function fail(m){f.srcdoc="<!DOCTYPE html><html><head><meta charset=utf-8><title>patch</title></head><body><h1>patch</h1><p>"+m+"</p></body></html>"}
var h=(location.hash||"").replace(/^#/,"");
if(!h||h.indexOf(P)){fail("needs a #p1: payload");return}
var s=h.slice(3).replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";
var b,i,bytes,t=0;try{b=atob(s);bytes=new Uint8Array(b.length);for(i=0;i<b.length;i++)bytes[i]=b.charCodeAt(i)}catch(e){fail("bad payload");return}
(async function(){try{var ds=new DecompressionStream("deflate-raw"),ch=[],g=ds.writable.getWriter(),r;g.write(bytes);g.close();var rd=ds.readable.getReader();for(;;){r=await rd.read();if(r.done)break;ch.push(r.value);t+=r.value.length}var o=new Uint8Array(t),p=0;for(i=0;i<ch.length;i++){o.set(ch[i],p);p+=ch[i].length}f.srcdoc=new TextDecoder().decode(o)}catch(e){fail("bad: "+e.message)}})();
})();
</script></body></html>
