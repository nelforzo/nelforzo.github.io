<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ongaku</title>
  <meta name="description" content="Ongaku — offline playlists, YouTube audio. Your library stays on this device.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23165c4b'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23fff'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/screens/playlists.css">
  <link rel="stylesheet" href="css/screens/playlist-detail.css">
</head>
<body>
  <noscript>
    <p class="banner banner--warn">Ongaku needs JavaScript to run.</p>
  </noscript>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="app-header">
    <a class="brand" href="#/playlists" aria-label="Ongaku — your playlists">
      <span class="brand__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="9"></circle>
          <circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"></circle>
        </svg>
      </span>
      <span class="brand__names">
        <span class="brand__name">Ongaku</span>
        <span class="brand__tag">Offline playlists</span>
      </span>
    </a>
    <p class="app-header__hint">Audio from YouTube</p>
  </header>

  <p class="banner banner--warn" id="offline-banner" role="status" hidden>
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M12 18h.01M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M2 2l20 20"/>
    </svg>
    You're offline. Your playlists still work, but playback needs an internet connection.
  </p>

  <main id="main" class="app-main" tabindex="-1">
    <div id="screen" class="screen" aria-live="polite"></div>
  </main>

  <footer class="player" id="player" hidden aria-label="Player">
    <div class="player__track">
      <div class="cover cover--player" id="player-cover"></div>
      <div class="player__meta">
        <p class="player__title" id="player-title">No song selected</p>
        <p class="player__subtitle" id="player-subtitle"></p>
      </div>
    </div>

    <div class="player__center">
      <div class="player__controls">
        <button class="icon-btn" id="player-prev" type="button" aria-label="Previous song">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        </button>
        <button class="icon-btn icon-btn--primary" id="player-toggle" type="button" aria-label="Play" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="icon-btn" id="player-next" type="button" aria-label="Next song">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M18 5h-2v14h2zM4 5v14l11-7z"/></svg>
        </button>
      </div>
      <div class="player__timeline">
        <span class="player__time" id="player-current">0:00</span>
        <input class="range" id="player-seek" type="range" min="0" max="0" step="1" value="0" aria-label="Seek in current song" disabled>
        <span class="player__time" id="player-duration">0:00</span>
      </div>
    </div>

    <div class="player__status">
      <span class="player__badge">YouTube</span>
      <a class="player__open" id="player-open" href="#" target="_blank" rel="noopener noreferrer" hidden>Open</a>
      <span class="player__message" id="player-message" role="status"></span>
    </div>
  </footer>

  <dialog class="modal" id="modal" aria-labelledby="modal-title">
    <form class="modal__panel" id="modal-form" novalidate>
      <div class="modal__head">
        <h2 class="modal__title" id="modal-title"></h2>
        <button class="icon-btn" type="button" id="modal-close" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal__body" id="modal-body"></div>
      <p class="form-error" id="modal-error" role="alert" hidden></p>
      <div class="modal__actions" id="modal-actions"></div>
    </form>
  </dialog>

  <div class="busy" id="busy" hidden>
    <div class="busy__panel" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <p id="busy-text">Working…</p>
    </div>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite"></div>

  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <div id="yt-host" class="yt-host" aria-hidden="true"></div>

  <script src="js/vendor/dexie.min.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/images.js"></script>
  <script src="js/db.js"></script>
  <script src="js/youtube.js"></script>
  <script src="js/player.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/router.js"></script>
  <script src="js/screens/playlists.js"></script>
  <script src="js/screens/playlist-detail.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
